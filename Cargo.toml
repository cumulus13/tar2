[package]
name = "tar2"
version = "0.1.2"
edition = "2021"
authors = ["Hadi Cahyadi <cumulus13@gmail.com>"]
description = "A feature-rich tar replacement with tree view, colors, emoji, and cross-platform config"
homepage = "https://github.com/cumulus13/tar2"
repository = "https://github.com/cumulus13/tar2"
license = "MIT"

[[bin]]
name = "tar2"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.53", features = ["derive", "color"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.4"
xz2 = "0.1"
zstd = "=0.12.4"
walkdir = "2"
glob = "0.3"
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "=0.8.13"
dirs = "5"
anyhow = "1"
indicatif = "=0.17.7"
chrono = { version = "0.4", features = ["serde"] }
humansize = "2"
regex = "1"
once_cell = "1"
ctrlc = "3"
clap-version-flag = "1.0.5"

[dependencies.indexmap]
version = "=2.2.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
